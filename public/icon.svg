<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Mettle mark: an M cut as an upward chevron pair — the shape of a bar
       path and of a rising chart at once — over the signature gradient. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#4f8bff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b0b10"/>
  <!-- Ascending chevrons forming the M's peaks. -->
  <path d="M104 316 L182 208 L256 300 L330 208 L408 316"
        fill="none" stroke="url(#g)" stroke-width="54"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The bar: grounded, solid, the thing you actually lift. -->
  <rect x="140" y="372" width="232" height="34" rx="17" fill="#f5f5f7"/>
</svg>
