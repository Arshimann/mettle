<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#060608" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mettle" />
    <title>Mettle</title>
    <!-- Set theme, accent and display font before paint, so there's no flash
         of the wrong palette. This does the minimum: it writes the attributes
         and the raw accent hex only. The derived accent tokens (gradient,
         glow, contrast-checked foreground) need real colour maths and arrive
         one tick later from React — invisible, since --accent alone already
         paints every accent surface. -->
    <script>
      (function () {
        // Canvas colours must match --canvas in index.css for each theme.
        var CANVAS = {
          dark: '#060608',
          light: '#f7f7f5',
          editorial: '#f5f3ec',
          bold: '#0a0a0a',
          ember: '#0d0a09',
          sea: '#f2f6f6',
          carbon: '#000000',
        };
        var resolved = 'dark';
        var settings = null;
        try {
          var raw = localStorage.getItem('mettle.v1');
          if (raw) {
            var parsed = JSON.parse(raw);
            settings = (parsed && parsed.state && parsed.state.settings) || null;
          }
          var mode = (settings && settings.theme) || 'dark';
          if (mode === 'system') {
            var pair = (settings && settings.systemPair) || {};
            var light = pair.light || 'light';
            var dark = pair.dark || 'dark';
            mode = window.matchMedia('(prefers-color-scheme: light)').matches ? light : dark;
          }
          if (CANVAS[mode]) resolved = mode;
        } catch (e) {
          /* fall through to dark */
        }
        var el = document.documentElement;
        el.dataset.theme = resolved;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', CANVAS[resolved]);
        try {
          if (settings) {
            if (typeof settings.accent === 'string' && /^#[0-9a-f]{6}$/i.test(settings.accent) && resolved !== 'editorial') {
              el.style.setProperty('--accent', settings.accent);
            }
            if (settings.displayFont === 'metal') {
              el.dataset.font = 'metal';
              el.dataset.fontScope = settings.displayFontScope || 'wordmark';
            }
          }
        } catch (e) {
          /* cosmetic only */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
